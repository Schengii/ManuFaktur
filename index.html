<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Willkommen | Manufaktur Schenk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            font-family: 'Lato', sans-serif;
            background-color: #1a1a1a; 
        }

        .hero-section {
            position: relative; 
            height: 100vh; 
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            z-index: 1;
        }


        /* Das Hintergrundbild als eigenes Element (Pseudo-Element) */
        .hero-section::before {
            content: "";
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.5)), url('./Vorlage Manufaktur PP/Flyer-Seite1.png');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            opacity: 0.25; 
            transition: opacity 0.8s ease;
            z-index: -1; 
        }

       
        .hero-section:has(.hero-btn:hover)::before {
            opacity: 1; 
        }

        .hero-content {
            z-index: 2;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 15px;
        }

        .hero-content h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9); 
        }

        .hero-content p {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
        }

        .hero-btn {
            display: inline-block;
            padding: 15px 45px;
            border: 2px solid white;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            transition: all 0.4s ease;
            background-color: rgba(255,255,255,0.1); 
            backdrop-filter: blur(5px); 
        }

        .hero-btn:hover {
            background-color: white;
            color: #2c3e50;
            transform: scale(1.2); 
            box-shadow: 0 0 30px rgba(255,255,255,0.6);
            border-color: white;
        }

        .hero-btn i {
            margin-left: 10px;
            transition: margin-left 0.5s;
        }
        
        .hero-btn:hover i {
            margin-left: 20px;
        }



        /* Handy-Anpassung */
        @media (max-width: 768px) {
            .hero-content h1 { font-size: 3.5rem; }
            .hero-content p { font-size: 1rem; letter-spacing: 1px; }
            .hero-btn { padding: 12px 30px; font-size: 1rem; }
            .hero-section::before { opacity: 0.6; }
        }
    </style>
    
</head>
<body>

    <div class="hero-section">
        <div class="hero-content">
            <h1>MANUfaktur</h1>
            <p>Individuelle Malerei & Handwerkskunst</p>
          
            <a href="Home.html" class="hero-btn">
                Entdecke mehr! <i class="fa fa-angle-right"></i>
            </a>
        </div>
    </div>
    
</body>
</html>
