<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Willkommen bei ManuFAKTUR Schenk. Individuelle Malerei, Tierportraits und Landschaften in Acryl und Öl aus Bonn.">
    <title>Willkommen | ManuFAKTUR Schenk</title>

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="ManuFAKTUR Schenk – Individuelle Malerei">
    <meta property="og:description" content="Handgemalte Tierportraits und Landschaften aus Bonn. Jedes Bild ein Unikat.">
    <meta property="og:image" content="assets/images/artworks/bild18-eulen.jpg">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="de_DE">

    <!-- Favicon -->
    <link rel="icon" href="assets/images/logos/favicon.png" type="image/png">
    <link rel="icon" href="assets/images/logos/favicon.svg" type="image/svg+xml">

    <!-- Lokales Font Awesome für DSGVO-Konformität -->
    <link rel="stylesheet" href="assets/vendor/font-awesome/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body class="hero-page">

    <main>
        <div class="hero-section">
            <div class="hero-content">
                <h1>ManuFAKTUR</h1>
                <p>Individuelle Malerei &amp; Handwerkskunst</p>
                <a href="Home.html" class="hero-btn">Entdecke mehr! <i class="fa fa-angle-right" aria-hidden="true"></i></a>
            </div>
        </div>
    </main>

    <button onclick="topFunction()" class="back-to-top" title="Nach oben">
        <i class="fa fa-angle-up" aria-hidden="true"></i>
    </button>

    <!-- Nur topFunction und reveal werden benötigt, keine Nav/Footer-Injektion -->
    <script>
        function topFunction() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        window.onscroll = function() {
            const btn = document.querySelector('.back-to-top');
            if (btn) btn.style.display = (document.documentElement.scrollTop > 150) ? 'flex' : 'none';
        };
    </script>
</body>
</html>
