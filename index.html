<html lang="de">
<head>

    <meta property="og:description" content="Handgemalte Tierportraits und Landschaften aus Bonn. Jedes Bild ein Unikat.">
    <meta property="og:image" content="https://www.manufaktur-malerei.de/assets/images/artworks/bild18-eulen.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.manufaktur-malerei.de/">
    <meta property="og:locale" content="de_DE">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ManuFAKTUR Schenk – Individuelle Malerei">
    <meta name="twitter:description" content="Handgemalte Tierportraits und Landschaften aus Bonn. Jedes Bild ein Unikat.">
    <meta name="twitter:image" content="https://www.manufaktur-malerei.de/assets/images/artworks/bild18-eulen.jpg">

    <!-- Favicon -->
    <link rel="icon" href="assets/images/logos/favicon.png" type="image/png">
    <link rel="icon" href="assets/images/logos/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/images/logos/apple-touch-icon.png">

    <!-- Kanonische URL für SEO -->
    <link rel="canonical" href="https://www.manufaktur-malerei.de/">
    <meta name="theme-color" content="#7a5a1f">

    <!-- Preload kritischer Web-Fonts -->
    <link rel="preload" href="assets/fonts/lato-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/playfairdisplay-700-normal.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="manifest" href="manifest.json">
    <!-- Lokales Font Awesome für DSGVO-Konformität -->
    <link rel="stylesheet" href="assets/vendor/font-awesome/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="style.min.css?v=12">
    <script>
      (function(){
        try{
          var t=localStorage.getItem('manufaktur_theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
          document.documentElement.setAttribute('data-theme',t);
          if(t==='dark')document.documentElement.classList.add('dark-mode');
          var l=localStorage.getItem('manufaktur_lang')||'de';
          document.documentElement.setAttribute('lang',l);
        }catch(e){}
      })();
    </script>
    <!-- SEO Schema.org Strukturierte Daten -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ManuFAKTUR Schenk",
      "alternateName": "ManuFAKTUR",
      "url": "https://www.manufaktur-malerei.de/",
      "description": "Atelier für individuelle Malerei, Tierportraits und Landschaften von Manuela Schenk in Bonn."
    }
    </script>
</head>

<body class="hero-page">

    <a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>

    <main id="main-content">
        <div class="hero-section">
            <div class="hero-content">
                <h1>ManuFAKTUR</h1>
                <p data-i18n-de="Individuelle Malerei &amp; Handwerkskunst" data-i18n-en="Custom Paintings &amp; Craftsmanship">Individuelle Malerei &amp; Handwerkskunst</p>
                <a href="Home.html" class="hero-btn" data-i18n-de="Entdecke mehr!" data-i18n-en="Discover more!">Entdecke mehr! <i class="fa fa-angle-right" aria-hidden="true"></i></a>
            </div>
        </div>
    </main>

    <button onclick="topFunction()" class="back-to-top" title="Nach oben" aria-label="Nach oben scrollen" data-i18n-aria-label="back_to_top">
        <i class="fa fa-angle-up" aria-hidden="true"></i>
    </button>

    <!-- Nur topFunction und reveal werden benötigt, keine Nav/Footer-Injektion.
         Minimaler eigenständiger Sprachwechsel (ohne Home.js), damit die gespeicherte
         Spracheinstellung auch auf dieser Einstiegsseite respektiert wird. -->
    <script>
        function topFunction() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        window.onscroll = function() {
            const btn = document.querySelector('.back-to-top');
            if (btn) btn.style.display = (document.documentElement.scrollTop > 150) ? 'flex' : 'none';
        };
        (function () {
            try {
                var lang = localStorage.getItem('manufaktur_lang') || 'de';
                if (lang === 'en') {
                    document.querySelectorAll('[data-i18n-en]').forEach(function (el) {
                        var icon = el.querySelector('i');
                        el.innerHTML = el.getAttribute('data-i18n-en') + (icon ? ' ' + icon.outerHTML : '');
                    });
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
