name: CI & Build-Prüfung

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: JavaScript linten (ESLint)
        run: npm run lint

      - name: Produktions-Build & CSP-Hashes generieren
        run: npm run build

      - name: Prüfen, ob die Asset-Version in HTML und sw.js übereinstimmt
        run: npm run version:check

      - name: Galerie-Daten, HTML und Bilddateien auf Konsistenz prüfen
        run: npm run check:gallery

      - name: Prüfen, ob minifizierte Dateien & CSP synchron sind
        run: |
          git diff --exit-code style.min.css Home.min.js .htaccess vercel.json sw.js assets/vendor/font-awesome '*.html' || (echo "Fehler: Die minifizierten Dateien oder CSP-Hashes sind nicht synchron mit dem Quellcode! Bitte 'npm run build' lokal ausführen und committen." && exit 1)

      # Die Tests nutzen das auf dem Runner vorinstallierte Google Chrome (channel: 'chrome'),
      # ein Browser-Download ist nicht nötig.
      - name: Funktions- und Barrierefreiheitstests ausführen (inkl. axe-core)
        run: npm test

  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Abhängigkeiten installieren
        run: npm ci

      # Misst Performance, Barrierefreiheit, Best Practices und SEO (Mobile-Profil) gegen den lokalen
      # Server mit Produktions-CSP. Schwellen stehen in lighthouserc.json; unterschreitet eine Seite
      # sie im Median von zwei Läufen, schlägt der Job fehl.
      - name: Lighthouse-Prüfung
        run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          CHROME_PATH: /usr/bin/google-chrome
